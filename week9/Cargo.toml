[package]
name = "infer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Week 9 UAI inference by tensor contraction and belief propagation"

[dependencies]
omeco = "0.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tenferro-cpu = "0.9.0"
tenferro-einsum = { version = "0.9.0", default-features = false, features = ["native"] }
tenferro-tensor = "0.9.0"

[profile.release]
opt-level = 3
lto = "thin"
