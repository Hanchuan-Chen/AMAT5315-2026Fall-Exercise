[package]
name = "thermo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Week 10 Ising thermodynamics by boundary MPS and TRG"

[dependencies]
nalgebra = "0.33"
rand = "=0.8.8"
rand_distr = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"

