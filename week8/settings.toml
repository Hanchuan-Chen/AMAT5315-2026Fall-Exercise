[part1]
seed = 1730
control_shuffles = 20
relations = [
  ["iran", "tehran", "turkey", "ankara", "russia", "moscow", "china", "beijing", "france", "paris", "sweden", "stockholm", "japan", "tokyo", "peru", "lima", "kenya", "nairobi"],
  ["king", "queen", "man", "woman", "he", "she", "brother", "sister", "father", "mother", "son", "daughter", "uncle", "aunt", "boy", "girl", "husband", "wife"],
  ["big", "bigger", "small", "smaller", "fast", "faster", "dark", "darker", "cold", "colder", "old", "older", "strong", "stronger", "long", "longer", "tall", "taller"],
]
relation_names = ["country -> capital", "male -> female", "adjective -> comparative"]

[part2]
train_fraction = 0.90
candidate_k = [0.0001, 0.001, 0.01, 0.1, 1.0]
