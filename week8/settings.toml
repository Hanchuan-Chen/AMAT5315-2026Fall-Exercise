[part5]
n_layers = 2
width = 96
heads = 4
context = 64
steps = 6000
batch_size = 32
learning_rate = 0.003
warmup_steps = 300
final_lr_fraction = 0.1
weight_decay = 0.01
seed = 2026
sample_seed = 1848
sampler_samples = 100000
self_consistency_sequences = 128
self_consistency_length = 128

[part6]
drop_highest_loss = 5
huber_delta = 0.001
bootstrap = 400
compute_budget = 5.76e23
chinchilla_n = 70e9
