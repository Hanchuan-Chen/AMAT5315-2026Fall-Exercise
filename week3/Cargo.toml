[package]
name = "ising"
version = "0.1.0"
edition = "2024"
description = "Sample the two-dimensional Ising model along a temperature ramp"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
debug = 1
